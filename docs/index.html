<title>我們的跨年小旅行</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: 旅行手帳封面 → 篩選貼紙 → 12 張行程卡（海報縮圖＋三個數字）→ 比價連結；白底、固定亮色 */
:root{
  --bg:#FFFDF7; --paper:#FFFFFF; --paper-2:#FFF7E8; --line:#E8DCC8; --line-ink:#3B3024;
  --ink:#3B3024; --ink-dim:#6F6151; --ink-faint:#8A7B6A;
  --p:#E8743B; --s:#FFB84C; --soft:#FFF0E3;
  --ok:#3E9B5F; --warn:#C9811A; --danger:#D1495B;
  --font-hand:'LXGW WenKai TC','PingFang TC',serif;
  --font-body:'Huninn','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-num:'Nunito','Huninn',system-ui,sans-serif;
  --blob:255px 18px 225px 18px / 18px 225px 18px 255px; --pill:999px;
  --spring:cubic-bezier(.34,1.56,.64,1); --shadow:0 4px 0 var(--line);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(var(--line) .8px, transparent .8px);background-size:22px 22px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:grid;gap:24px}
.wrap > *{min-width:0}
h1,h2,h3{margin:0;font-family:var(--font-hand);font-weight:700;text-wrap:balance;line-height:1.25}
a{color:var(--p)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.faint{color:var(--ink-faint);font-size:12.5px}
.ico{display:inline-block;width:18px;height:18px;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;background:var(--paper);border:2px solid var(--line-ink);border-radius:var(--blob);box-shadow:var(--shadow);padding:22px 24px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,6vw,54px)}
.hero h1 small{display:block;font-size:.42em;color:var(--p);font-weight:400;margin-top:4px}
.hero p{margin:10px 0 0;max-width:42ch;color:var(--ink-dim)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .meta span{background:var(--paper-2);border:2px dashed var(--line-ink);border-radius:var(--pill);padding:4px 12px;font-size:13.5px}
.hero svg.art{width:100%;max-width:360px;height:auto;justify-self:center}
.art .bear{fill:#A5724E;stroke:#3B3024;stroke-width:2}.art .bear-in{fill:#E9C9A8}.art .fox{fill:#FFFFFF;stroke:#3B3024;stroke-width:2}.art .fox-ear{fill:#F6C9C9}.art .eye{fill:#3B2A20;stroke:#3B2A20;stroke-width:1.2;stroke-linecap:round}.art .cheek{fill:#F6A99A}.art .ground{fill:var(--soft)}.art .ln{stroke:var(--line-ink);stroke-width:2;fill:none;stroke-linecap:round}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters button{font:inherit;font-size:14px;background:var(--paper);border:2px solid var(--line-ink);border-radius:var(--pill);padding:6px 14px;cursor:pointer;color:var(--ink);transition:transform .3s var(--spring);box-shadow:var(--shadow)}
.filters button:hover{transform:translateY(-2px)}
.filters button[aria-pressed="true"]{background:var(--p);color:#fff;border-color:var(--p)}
.filters .sort{margin-left:auto;font:inherit;font-size:14px;border:2px solid var(--line-ink);border-radius:var(--pill);padding:6px 12px;background:var(--paper);color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--paper);border:2px solid var(--line-ink);border-radius:var(--blob);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr;text-decoration:none;color:inherit;transition:transform .3s var(--spring);position:relative;min-width:0}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
.card .cov{aspect-ratio:16/9;background:var(--soft);display:grid;place-items:center;overflow:hidden;border-bottom:2px solid var(--line-ink)}
.card .cov img{width:100%;height:100%;object-fit:cover;display:block}
.card .cov .ico{width:48px;height:48px;color:var(--p);opacity:.7}
.card .body{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.card h2{font-size:24px;display:flex;align-items:center;gap:8px}
.card h2 small{font-size:13px;font-family:var(--font-body);color:var(--ink-faint);font-weight:400;margin-left:auto;white-space:nowrap}
.card .tag{color:var(--p);font-family:var(--font-hand);font-size:16px}
.card .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card .nums div{background:var(--paper-2);border-radius:12px;padding:6px 8px;text-align:center}
.card .nums b{display:block;font-family:var(--font-num);font-size:18px;font-weight:900;color:var(--p);line-height:1.1}
.card .nums span{font-size:11.5px;color:var(--ink-faint)}
.card .chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:4px 9px;border-radius:var(--pill);background:var(--soft);color:var(--ink-dim);border:1.5px solid var(--line)}
.chip.hot{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-color:transparent}
.chip.rmq{background:color-mix(in srgb,#2E86DE 13%,transparent);color:#2E6FB0;border-color:transparent;font-weight:700}
.chip.rmq.soft{font-weight:400;border:1.5px dashed #2E6FB0}
.chip.car{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border-color:transparent}
.card .go{margin-top:2px;font-size:14px;color:var(--p);font-weight:700}
.card .ribbon{position:absolute;top:12px;left:-6px;background:var(--s);color:#3B3024;font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:0 var(--pill) var(--pill) 0;border:2px solid var(--line-ink);border-left:0;transform:rotate(-3deg)}
.card.soon{opacity:.75}
.card.soon .cov{filter:grayscale(.3)}
.more{background:var(--paper);border:2px dashed var(--line-ink);border-radius:var(--blob);padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.more a{font-weight:700}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero svg.art{max-width:240px;order:-1}.filters .sort{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<script>

    const r = p.rmq || {kind:'none'}; const k = r.price ? ' ' + Math.round(r.price/1000) + 'K' : '';
    const rmqChip = r.kind === 'direct' ? `<span class="chip rmq">台中直飛${k}${r.price > 13000 ? '（超預算）' : ''}</span>` : r.kind === 'maybe' ? `<span class="chip rmq soft">台中直飛待確認${k}</span>` : '<span class="chip">台中沒直飛</span>';
    const chips = [rmqChip, nye(p) ? '<span class="chip hot">能跨年</span>' : '', hasCar(p) ? '<span class="chip car">可自駕</span>' : '', ...(p.challenges||[]).slice(0,2).map(c => `<span class="chip">${esc(c)}</span>`), ...(p.foods||[]).slice(0,2).map(c => `<span class="chip">${esc(c)}</span>`)].join('');
    return `<a class="card ${p.placeholder ? 'soon' : ''}" href="${p.placeholder ? '#' : p.id + '.html'}" style="--p:${esc(p.palette?.primary||'#E8743B')};--s:${esc(p.palette?.secondary||'#FFB84C')};--soft:color-mix(in srgb,${esc(p.palette?.primary||'#E8743B')} 12%,#fff)">
      ${t && t[0] === cheapest ? '<span class="ribbon">最便宜</span>' : ''}
      <div class="cov">${p.cover ? `<img src="${esc(p.cover)}" alt="" loading="lazy">` : ico(p.motif||'star')}</div>
      <div class="body">
        <h2>${ico(p.motif||'star')}${esc(p.name)}<small>${esc(p.country)}</small></h2>
        <div class="tag">${esc(p.tagline||p.subtitle||'')}</div>
        <div class="nums">
          <div><b class="num">${p.dates ? esc(p.dates.out) + '→' + esc(p.dates.back) : '–'}</b><span>${p.dates?.nights ?? '?'} 晚</span></div>
          <div><b class="num">${t ? wan(t[0]) + '–' + wan(t[1]) : '–'}</b><span>萬・兩人</span></div>
          <div><b class="num">${mf ? Math.round(mf/1000) + 'K' : '–'}</b><span>機票每人</span></div>
        </div>
        <div class="chips">${chips}</div>
        <div class="go">${p.placeholder ? '查詢中…' : '打開手帳 →'}</div>
      </div></a>`;
  }).join('') || '<p class="faint">這個條件沒有符合的</p>';
}
document.querySelectorAll('#filters button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.f === filter); b.onclick = () => { filter = b.dataset.f; store.set('hub-f', filter); document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); }; });
const sel = document.getElementById('sort'); sel.value = sortKey; sel.onchange = () => { sortKey = sel.value; store.set('hub-s', sortKey); render(); };
render();
</script>
