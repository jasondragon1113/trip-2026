<title>跨年旅行比較</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: 狐狸與貍貓的旅行繪本 — 可愛頁首（飛機虛線＋小雪）→ 總覽比較 → 地點分頁；手機一欄 */
:root{
  --bg:#FFF6EA; --surface:#FFFDF8; --surface-2:#FCEBD6; --line:#F1D9BC; --line-strong:#E6BF95;
  --ink:#4A3426; --ink-dim:#7A5C49; --ink-faint:#86685A;
  --accent:#D9661F; --accent-bg:rgba(217,102,31,.11);
  --lamp:#5E8A4E; --lamp-bg:rgba(94,138,78,.13);
  --ok:#4C8A3E; --warn:#B26A00; --danger:#C2412D;
  --band:rgba(94,138,78,.15); --bar:#F29A52; --snow:#F4D3B0;
  --font-display:'Huninn','Zen Maru Gothic','PingFang TC',sans-serif;
  --font-body:'Huninn','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-num:'Nunito','Huninn',ui-rounded,system-ui,sans-serif;
  --r:18px; --r-sm:12px; --pill:999px;
  --fox:#F08A3C; --fox-dark:#C9631F; --tanuki:#9A7258; --tanuki-dark:#5B3F30; --cream:#FFF4E2; --cheek:#F6A99A;
  --shadow:0 6px 18px rgba(184,110,50,.12);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1714; --surface:#29201B; --surface-2:#352920; --line:#46362B; --line-strong:#5C4636;
  --ink:#F7EADD; --ink-dim:#D6BFAA; --ink-faint:#B59E8A;
  --accent:#FFA460; --accent-bg:rgba(255,164,96,.14);
  --lamp:#A9D493; --lamp-bg:rgba(169,212,147,.14);
  --ok:#A9D493; --warn:#F7C064; --danger:#FF9A85;
  --band:rgba(169,212,147,.13); --bar:#FFA460; --snow:#6B5444;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1714; --surface:#29201B; --surface-2:#352920; --line:#46362B; --line-strong:#5C4636;
  --ink:#F7EADD; --ink-dim:#D6BFAA; --ink-faint:#B59E8A;
  --accent:#FFA460; --accent-bg:rgba(255,164,96,.14);
  --lamp:#A9D493; --lamp-bg:rgba(169,212,147,.14);
  --ok:#A9D493; --warn:#F7C064; --danger:#FF9A85;
  --band:rgba(169,212,147,.13); --bar:#FFA460; --snow:#6B5444;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:28px}
h2{font-size:20px}
h3{font-size:15px;font-family:var(--font-body);font-weight:700}
a{color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.dim{color:var(--ink-dim)} .faint{color:var(--ink-faint);font-size:12px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.top .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-dim);font-size:13px;margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--pill);padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-dim);font:inherit;font-size:13px;padding:6px 14px;border-radius:var(--pill);cursor:pointer;transition:transform .3s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:active{transform:scale(.95)}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:6px 12px}
button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* overview */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ov-head,.ov-row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(220px,2fr) minmax(110px,.9fr) minmax(90px,.7fr) minmax(150px,1.2fr);gap:14px;align-items:center;padding:10px 14px}
.ov-head{font-size:12px;color:var(--ink-faint);border-bottom:1px solid var(--line);letter-spacing:.04em}
.ov-row{border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.ov-row:last-child{border-bottom:0}
.ov-row:hover{background:var(--surface-2)}
.ov-row .name{font-family:var(--font-display);font-size:17px;font-weight:700}
.ov-row .name small{display:block;font-family:var(--font-body);font-size:12px;color:var(--ink-faint);font-weight:400}
.ov-row > *{min-width:0}
.bar{position:relative;height:14px}
.bar .band{position:absolute;top:0;bottom:0;background:var(--band);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.bar .rng{position:absolute;top:3px;height:8px;background:var(--bar);border-radius:4px;min-width:8px}
.lbl2{font-size:12px;color:var(--ink-dim);margin-top:2px}
.axis{position:relative;height:16px;font-size:11px;color:var(--ink-faint)}
.axis span{position:absolute;transform:translateX(-50%)}
.fl{font-size:13px;display:grid;gap:1px}
.verdict{font-size:13px;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:4px 8px;border-radius:var(--pill);white-space:nowrap;background:var(--surface-2);color:var(--ink-dim)}
.b-ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.b-danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.b-info{background:var(--accent-bg);color:var(--accent)}
.b-lamp{background:var(--lamp-bg);color:var(--lamp)}

/* destination tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);border-radius:var(--pill);padding:7px 16px;cursor:pointer;transition:transform .3s var(--spring)}
.tabs button:hover{transform:translateY(-2px)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:700}

.detail{display:grid;gap:16px}
.d-head{display:grid;gap:8px}
.d-head .tag{font-family:var(--font-display);font-size:18px;color:var(--lamp)}
.scores{display:flex;flex-wrap:wrap;gap:6px}
.dots{letter-spacing:2px;color:var(--lamp)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid2 > *{min-width:0}
.sec{padding:14px 16px;display:grid;gap:10px;align-content:start}
.sec-title{display:flex;align-items:center;gap:8px}
.sec-title svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface-2);color:var(--ink-dim);font-weight:500;text-align:left;padding:7px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.cost{display:grid;gap:6px}
.cost div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.cost .total{border-bottom:0;font-weight:700;font-size:16px}
.wx{display:flex;flex-wrap:wrap;gap:10px 22px}
.wx b{display:block;font-family:var(--font-num);font-size:20px;font-weight:500}
ol.days,ul.plain{margin:0;padding-left:20px;display:grid;gap:4px}
.events{display:grid;gap:6px}
.events div{display:grid;grid-template-columns:64px 1fr;gap:10px}
.special{border-color:var(--lamp)}
.special .sec-title svg{stroke:var(--lamp)}
.special p{margin:0}
details summary{cursor:pointer;color:var(--ink-dim)}
details ul{margin:8px 0 0;padding-left:20px;font-size:12px;word-break:break-all}
.note{font-size:12px;color:var(--ink-faint)}

@media (max-width:760px){
  h1{font-size:24px}
  .ov-head{display:none}
  .ov-row{grid-template-columns:1fr auto;gap:8px 12px}
  .ov-row .c-bar{grid-column:1/-1;order:3}
  .ov-row .c-fl{order:2;text-align:right}
  .ov-row .c-stay{order:4}
  .ov-row .c-v{grid-column:1/-1;order:5}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
/* plans */
.plans-wrap{display:grid;gap:8px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:4px}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:8px;align-content:start;min-width:0;transition:transform .3s var(--spring)}
.plan:hover{transform:translateY(-3px)}
.plan .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan h3{font-family:var(--font-display);font-weight:400;font-size:22px;display:flex;align-items:center;gap:8px}
.plan h3 svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plan .when{color:var(--accent)}
.plan .money{font-family:var(--font-num);font-size:22px;font-weight:800}
.plan .money small{font-size:12px;font-weight:600;color:var(--ink-faint)}
.plan .line{font-size:13px;color:var(--ink-dim)}
.plan .line b{color:var(--ink);font-weight:400}
.plan ol{margin:0;padding-left:20px;font-size:13px;display:grid;gap:2px}
.plan .pc{display:grid;gap:4px;font-size:13px}
.plan .pc span::before{display:inline-block;width:1.2em;color:var(--ok);content:"+"}
.plan .pc span.bad::before{color:var(--danger);content:"−"}
.plan button{justify-self:start;font:inherit;font-size:13px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:var(--pill);padding:6px 14px;cursor:pointer;transition:transform .3s var(--spring)}
.plan button:active{transform:scale(.95)}

/* cute layer */
h1,h2,.ov-row .name,.d-head .tag{font-weight:400}
h1{font-size:32px;letter-spacing:.02em}
.panel{border:1.5px solid var(--line);box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 20px 16px}
.hero .art{position:absolute;right:8px;bottom:0;top:auto;width:min(44%,250px);height:auto;opacity:.95;pointer-events:none}
.hero .art .trail{stroke:var(--accent);stroke-dasharray:3 7;stroke-linecap:round;fill:none;stroke-width:2.5}
.hero .art .fox{fill:var(--fox)}
.hero .art .ear{fill:var(--fox-dark)}
.hero .art .tanuki{fill:var(--tanuki)}
.hero .art .mask{fill:var(--tanuki-dark)}
.hero .art .cream{fill:var(--cream)}
.hero .art .eye{fill:#3B2A20;stroke:#3B2A20;stroke-width:1.2;stroke-linecap:round}
.hero .art .shine{fill:var(--cream)}
.hero .art .cheek{fill:var(--cheek)}
.hero .art .heart{fill:var(--cheek)}
.hero .art .ground{fill:var(--surface-2)}
.hero > div{position:relative}
.hero > #snow{position:absolute;inset:0;pointer-events:none}
.hero .sub{color:var(--accent);font-size:15px;margin-top:2px}
.flake{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:var(--snow);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(220px) translateX(18px)}}
.badge{padding:5px 10px}
.tabs button{border-width:1.5px;display:inline-flex;align-items:center;gap:6px}
.tabs button svg,.ov-row .name svg,.d-head h2 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ov-row .name{display:flex;align-items:center;gap:8px}
.ov-row .name svg{color:var(--accent);width:22px;height:22px}
.ov-row .name small{margin-top:-2px}
.d-head{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.d-head h2{display:flex;align-items:center;gap:8px}
.d-head h2 svg{color:var(--accent);width:26px;height:26px}
.dots{color:var(--accent);letter-spacing:1px}
.sec-title h2{font-size:18px}
.bar .rng{height:10px;top:2px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);box-shadow:0 3px 10px var(--accent-bg)}
@media (max-width:760px){h1{font-size:26px}.hero{padding-top:120px}.hero .art{top:4px;bottom:auto;right:50%;transform:translateX(50%);width:200px}}
@media (prefers-reduced-motion:reduce){.flake{display:none}}
</style>

<div class="wrap">
  <header class="top hero">
    <svg class="art" viewBox="0 0 260 130" aria-hidden="true">
      <ellipse class="ground" cx="168" cy="122" rx="88" ry="8"/>
      <path class="trail" d="M8 110 C 50 106, 70 60, 110 66"/>
      <!-- fox -->
      <path class="fox" d="M96 104c-8 2-16-6-12-16 4-9 16-6 18 2z"/>
      <ellipse class="fox" cx="132" cy="100" rx="22" ry="20"/>
      <path class="fox" d="M112 64 116 40 128 56z"/><path class="fox" d="M152 64 148 40 136 56z"/>
      <path class="ear" d="M116 58 118 46 124 55z"/><path class="ear" d="M148 58 146 46 140 55z"/>
      <ellipse class="fox" cx="132" cy="68" rx="22" ry="18"/>
      <path class="cream" d="M114 72c6 12 30 12 36 0-6 8-30 8-36 0z"/>
      <ellipse class="cream" cx="132" cy="104" rx="11" ry="12"/>
      <circle class="eye" cx="124" cy="68" r="2.2"/><circle class="eye" cx="140" cy="68" r="2.2"/>
      <ellipse class="cheek" cx="119" cy="74" rx="4" ry="2.4"/><ellipse class="cheek" cx="145" cy="74" rx="4" ry="2.4"/>
      <path class="eye" d="M130 74q2 2 4 0"/>
      <!-- tanuki -->
      <ellipse class="tanuki" cx="192" cy="102" rx="21" ry="19"/>
      <circle class="tanuki" cx="176" cy="56" r="6"/><circle class="tanuki" cx="208" cy="56" r="6"/>
      <ellipse class="tanuki" cx="192" cy="72" rx="21" ry="18"/>
      <ellipse class="mask" cx="184" cy="72" rx="6" ry="5"/><ellipse class="mask" cx="200" cy="72" rx="6" ry="5"/>
      <ellipse class="cream" cx="192" cy="104" rx="11" ry="11"/>
      <circle class="shine" cx="184" cy="72" r="1.8"/><circle class="shine" cx="200" cy="72" r="1.8"/>
      <ellipse class="cheek" cx="178" cy="80" rx="3.6" ry="2.2"/><ellipse class="cheek" cx="206" cy="80" rx="3.6" ry="2.2"/>
      <ellipse class="eye" cx="192" cy="79" rx="2.4" ry="1.6"/>
      <path class="heart" d="M162 34c-3-4-10-2-9 3 1 4 9 9 9 9s8-5 9-9c1-5-6-7-9-3z"/>
    </svg>
    <div>
      <h1>我們的跨年小旅行</h1>
      <div class="sub">兩個人要去哪裡呢？</div>
      <div class="meta">
        <span>12/27–1/5 選 4–5 天</span><span>兩人預算 6–10 萬</span><span>機票上限每人 13,000</span><span id="checked"></span>
      </div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="回程日">
        <button id="ret-1231" data-ret="to_1231" aria-pressed="true">12/31 回・4 晚</button>
        <button id="ret-0101" data-ret="to_0101" aria-pressed="false">1/1 回・5 晚</button>
      </div>
      <select id="sort" aria-label="排序">
        <option value="cost">總花費低→高</option>
        <option value="chill">最 chill</option>
        <option value="scenery">風景</option>
        <option value="food">好吃</option>
        <option value="ease">最輕鬆</option>
      </select>
    </div>
    <div id="snow" aria-hidden="true"></div>
  </header>

  <section aria-label="推薦方案" class="plans-wrap">
    <h2>推薦方案</h2>
    <div class="faint" id="plans-note"></div>
    <div class="plans" id="plans"></div>
  </section>

  <h2>9 個地點比較（12/27 出發）</h2>
  <section class="panel" aria-label="總覽">
    <div class="ov-head"><span>地點</span><span>兩人總花費（綠框＝預算 6–10 萬）</span><span>機票每人最低</span><span>住宿</span><span>一句話</span></div>
    <div id="ov"></div>
    <div class="ov-head" style="border:0;border-top:1px solid var(--line)"><span></span><div class="axis" id="axis"></div><span></span><span></span><span></span></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="地點"></nav>
  <section class="detail" id="detail"></section>

  leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>'
});
const PLACE_ICON = {ginzan:'onsen', aomori:'onsen', hakodate:'snow', aomori_hakodate:'snow', tokyo:'tower', seoul:'tower', busan:'wave', chiangmai:'leaf', danang:'wave'};
const pIcon = id => svg(PLACE_ICON[id] || 'star');
const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||ICON.info}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const twd = n => (n == null || isNaN(n)) ? '待確認' : 'NT$' + Math.round(n).toLocaleString('en-US');
const wan = n => (n/10000).toFixed(1).replace(/\.0$/, '');
const rng = a => Array.isArray(a) ? (a[0] === a[1] ? twd(a[0]) : `${twd(a[0])}–${Math.round(a[1]).toLocaleString('en-US')}`) : twd(a);
const link = (u, t) => u && /^https?:/.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t || '來源')}</a>` : esc(t || '');
const nights = () => ret === 'to_1231' ? 4 : 5;

function minFlight(p, from){
  const f = (p.flights||[]).filter(x => x.from === from && x.price_pp_twd);
  if (!f.length) return null;
  return f.reduce((a,b) => a.price_pp_twd <= b.price_pp_twd ? a : b);
}
function stayBadge(p){
  const hs = p.hotels||[];
  if (p.stay_status) return `<span class="badge ${p.stay_status.tone||''}">${esc(p.stay_status.text)}</span>`;
  const n = s => hs.filter(h => (h.availability||'').includes(s)).length;
  if (n('有空')) return `<span class="badge b-ok">${n('有空')} 間有空房</span>`;
  if (n('滿')) return `<span class="badge b-danger">查到的都滿</span>`;
  return `<span class="badge">未確認</span>`;
}
function availBadge(a){
  a = a || '未知';
  const t = a.includes('有空') ? 'b-ok' : a.includes('滿') ? 'b-danger' : a.includes('候補') ? 'b-warn' : '';
  return `<span class="badge ${t}">${esc(a)}</span>`;
}

function renderOverview(){
  const ps = [...DATA.places];
  if (sortKey === 'cost') ps.sort((a,b) => (a.total_for2_twd?.[ret]?.[0]??9e9) - (b.total_for2_twd?.[ret]?.[0]??9e9));
  else ps.sort((a,b) => (b.scores?.[sortKey]||0) - (a.scores?.[sortKey]||0));
  const max = Math.max(120000, ...ps.map(p => p.total_for2_twd?.[ret]?.[1] || 0)) * 1.05;
  const pct = v => (v/max*100).toFixed(2) + '%';
  document.getElementById('ov').innerHTML = ps.map(p => {
    const t = p.total_for2_twd?.[ret] || [];
    const r = minFlight(p,'RMQ'), y = minFlight(p,'TPE');
    const flLine = (code, f) => f ? `<span><span class="faint">${code}</span> <span class="num">${f.price_pp_twd.toLocaleString('en-US')}</span>${f.price_pp_twd > 13000 ? ' <span class="badge b-danger">超</span>' : ''}</span>` : `<span class="faint">${code} 無</span>`;
    const over = t[0] > 100000;
    const bar = t.length ? `<div class="bar" title="兩人 ${twd(t[0])}–${twd(t[1])}">
        <div class="band" style="left:${pct(60000)};width:calc(${pct(100000)} - ${pct(60000)})"></div>
        <div class="rng" style="left:${pct(t[0])};width:calc(${pct(t[1])} - ${pct(t[0])})"></div>
      </div><div class="lbl2 num">${wan(t[0])}–${wan(t[1])} 萬${over ? ' <span class="badge b-danger">超預算</span>' : t[1] > 100000 ? ' <span class="badge b-warn">可能超</span>' : ''}</div>` : '<span class="faint">待確認</span>';
    return `<div class="ov-row" data-id="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)} 詳情">
      <div class="name">${pIcon(p.id)}<span>${esc(p.name)}<small>${esc(p.country)}</small></span></div>
      <div class="c-bar">${bar}</div>
      <div class="fl c-fl">${flLine('台中', r)}${flLine('桃園', y)}</div>
      <div class="c-stay">${stayBadge(p)}</div>
      <div class="verdict c-v">${esc(p.verdict)}</div>
    </div>`;
  }).join('');
  const ticks = [0, 50000, 100000, 150000, 200000].filter(v => v <= max);
  document.getElementById('axis').innerHTML = ticks.map(v => `<span class="num" style="left:${pct(v)}">${v ? wan(v)+'萬' : '0'}</span>`).join('');
  document.querySelectorAll('.ov-row').forEach(el => {
    const go = () => { select(el.dataset.id); document.getElementById('tabs').scrollIntoView({behavior:'smooth'}); };
    el.onclick = go; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = DATA.places.map(p =>
    `<button role="tab" id="tab-${p.id}" aria-selected="${p.id === current}" data-id="${p.id}">${pIcon(p.id)}${esc(p.name)}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => select(b.dataset.id));
}

function renderDetail(){
  const p = DATA.places.find(x => x.id === current) || DATA.places[0];
  if (!p) return;
  const t = p.total_for2_twd?.[ret] || [];
  const sc = p.scores || {};
  const scoreNames = {chill:'chill', scenery:'風景', food:'好吃', value:'划算', ease:'輕鬆'};
  const itin = (ret === 'to_1231' ? p.itinerary_1231 : p.itinerary_0101) || p.itinerary_1231 || [];
  const flights = (p.flights||[]).slice().sort((a,b) => (a.from > b.from ? -1 : a.from < b.from ? 1 : 0) || (a.price_pp_twd||9e9) - (b.price_pp_twd||9e9));
  const fRows = flights.map(f => {
    const back = ret === 'to_0101' && f.back_alt ? f.back_alt : f.back;
    const tags = [
      f.fits_time_pref ? '<span class="badge b-ok">時段符合</span>' : '',
      f.price_pp_twd > 13000 ? '<span class="badge b-danger">超預算</span>' : '',
      f.verified === false ? '<span class="badge b-warn">估算</span>' : ''
    ].join(' ');
    return `<tr><td>${f.from === 'RMQ' ? '台中' : f.from === 'TPE' ? '桃園' : esc(f.from)}→${esc(f.to)}</td><td>${esc(f.airline)}</td><td class="num">${esc(f.out)}</td><td class="num">${esc(back)}</td><td class="r num">${f.price_pp_twd ? f.price_pp_twd.toLocaleString('en-US') : '待確認'}</td><td>${esc(f.baggage)}</td><td>${tags} ${link(f.source,'查')}</td></tr>`;
  }).join('');
  const hRows = (p.hotels||[]).map(h => `<tr><td>${link(h.source, h.name)}${h.note ? `<div class="faint">${esc(h.note)}</div>` : ''}</td><td>${esc(h.area)}</td><td class="r num">${h.nights ?? ''}</td><td class="r num">${h.price_night_for2_twd ? h.price_night_for2_twd.toLocaleString('en-US') : '待確認'}</td><td>${esc(h.meals)}</td><td>${availBadge(h.availability)}</td></tr>`).join('');
  const w = p.weather || {};
  const specials = (p.special||[]).map(s => `<div class="panel sec special"><div class="sec-title">${svg(s.icon||'alert')}<h2>${esc(s.title)}</h2></div>${(s.body||[]).map(x => `<p>${esc(x)}</p>`).join('')}${s.sources?.length ? `<details><summary>來源</summary><ul>${s.sources.map(u => `<li>${link(u,u)}</li>`).join('')}</ul></details>` : ''}</div>`).join('');

  document.getElementById('detail').innerHTML = `
    <div class="d-head">
      <h2 style="font-size:26px">${pIcon(p.id)}${esc(p.name)} <span class="dim" style="font-size:15px;font-family:var(--font-body);font-weight:400">${esc(p.country)}</span></h2>
      <div class="tag">${esc(p.tagline)}</div>
      <div>${esc(p.verdict)}</div>
      <div class="scores">${Object.keys(scoreNames).map(k => `<span class="badge">${scoreNames[k]} <span class="dots" aria-label="${sc[k]||0} 分">${'♥'.repeat(sc[k]||0)}${'♡'.repeat(5-(sc[k]||0))}</span></span>`).join('')}</div>
    </div>
    ${specials}
    <div class="grid2">
      <div class="panel sec"><div class="sec-title">${svg('wallet')}<h2>兩個人大概要花（${ret === 'to_1231' ? '12/31 回' : '1/1 回'}）</h2></div>
        <div class="cost num">
          <div><span>機票（最便宜×2）</span><span>${(() => { const m = [minFlight(p,'RMQ'),minFlight(p,'TPE')].filter(Boolean).sort((a,b)=>a.price_pp_twd-b.price_pp_twd)[0]; return m ? twd(m.price_pp_twd*2) : '待確認'; })()}</span></div>
          <div><span>吃（每天）</span><span>${rng(p.daily_food_for2_twd)}</span></div>
          <div><span>當地交通</span><span>${rng(p.local_transport_for2_twd)}</span></div>
          <div><span>門票/其他</span><span>${rng(p.tickets_other_for2_twd)}</span></div>
          <div class="total"><span>合計</span><span>${t.length ? rng(t) : '待確認'}</span></div>
        </div>
        ${t[0] > 100000 ? '<span class="badge b-danger">最低就超過 10 萬預算</span>' : t[1] > 100000 ? '<span class="badge b-warn">高估會超過 10 萬</span>' : t.length ? '<span class="badge b-ok">在預算內</span>' : ''}
        <div class="faint">${esc(p.fx)}</div>
      </div>
      <div class="panel sec"><div class="sec-title">${svg('cloud')}<h2>天氣（12 月底）</h2></div>
        <div class="wx"><div><span class="faint">白天</span><b>${w.high_c ?? '–'}°</b></div><div><span class="faint">晚上</span><b>${w.low_c ?? '–'}°</b></div>${w.sunset ? `<div><span class="faint">日落</span><b>${esc(w.sunset)}</b></div>` : ''}</div>
        <div>${esc(w.conditions)}</div>
        ${w.wear ? `<div class="dim">穿：${esc(w.wear)}</div>` : ''}
      </div>
    </div>
    <div class="panel sec"><div class="sec-title">${svg('plane')}<h2>機票（每人來回）</h2></div>
      <div class="tbl"><table><thead><tr><th>航線</th><th>航空</th><th>去程</th><th>回程</th><th class="r">每人</th><th>行李</th><th></th></tr></thead><tbody>${fRows || '<tr><td colspan="7" class="faint">待確認</td></tr>'}</tbody></table></div>
    </div>
    <div class="panel sec"><div class="sec-title">${svg('bed')}<h2>住宿</h2></div>
      <div class="tbl"><table><thead><tr><th>旅館</th><th>區域</th><th class="r">晚</th><th class="r">兩人每晚</th><th>餐</th><th>空房</th></tr></thead><tbody>${hRows || '<tr><td colspan="6" class="faint">待確認</td></tr>'}</tbody></table></div>
    </div>
    <div class="grid2">
      <div class="panel sec"><div class="sec-title">${svg('route')}<h2>行程（${nights()} 晚）</h2></div><ol class="days">${itin.map(d => `<li>${esc(d)}</li>`).join('')}</ol></div>
      <div class="panel sec"><div class="sec-title">${svg('party')}<h2>那幾天有什麼活動</h2></div>
        <div class="events">${(p.events||[]).map(e => `<div><span class="num dim">${esc(e.date)}</span><span><b>${esc(e.name)}</b>${e.note ? `<br><span class="dim">${esc(e.note)}</span>` : ''}</span></div>`).join('') || '<span class="faint">待確認</span>'}</div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel sec"><div class="sec-title">${svg('star')}<h2>一定要去</h2></div><ul class="plain">${(p.highlights||[]).map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>
      <div class="panel sec"><div class="sec-title">${svg('alert')}<h2>小提醒</h2></div><ul class="plain">${(p.risks||[]).map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>
    </div>
    ${p.sources?.length ? `<details class="panel sec"><summary>全部來源（${p.sources.length}）</summary><ul>${p.sources.map(u => `<li>${link(u,u)}</li>`).join('')}</ul></details>` : ''}
  `;
}

function select(id){
  current = id; store.set('dest', id);
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  renderDetail();
}
document.querySelectorAll('.seg button').forEach(b => {
  b.setAttribute('aria-pressed', b.dataset.ret === ret);
  b.onclick = () => { ret = b.dataset.ret; store.set('ret', ret);
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderOverview(); renderDetail(); };
});
const sel = document.getElementById('sort');
sel.value = sortKey;
sel.onchange = () => { sortKey = sel.value; store.set('sort', sortKey); renderOverview(); };
document.getElementById('checked').textContent = '查價 ' + (DATA.checked || '');
function renderPlans(){
  document.getElementById('plans-note').textContent = DATA.plans_note || '';
  document.getElementById('plans').innerHTML = (DATA.plans||[]).map(pl => `<article class="plan">
    <div class="top-row"><span class="badge ${pl.tone||''}">${esc(pl.label)}</span><span class="faint">${pl.nights} 晚</span></div>
    <h3>${pIcon(pl.id)}${esc(pl.place)}</h3>
    <div class="when num">${esc(pl.dates)}</div>
    <div class="money">${wan(pl.total[0])}–${wan(pl.total[1])} 萬 <small>兩個人全包</small></div>
    <div class="line"><b>機票</b>　${esc(pl.flight)}</div>
    <div class="line"><b>住宿</b>　${esc(pl.stay)}</div>
    <ol>${pl.days.map(d => `<li>${esc(d)}</li>`).join('')}</ol>
    <div class="pc"><span>${esc(pl.good)}</span><span class="bad">${esc(pl.bad)}</span></div>
    <button data-go="${pl.id}">看${esc(pl.place.replace('日本東北雪國','銀山溫泉'))}詳細</button>
  </article>`).join('');
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { select(b.dataset.go); document.getElementById('tabs').scrollIntoView({behavior:'smooth'}); });
}
renderPlans(); renderOverview(); renderTabs(); renderDetail();
// Gentle snow in the header only / 只有頁首下小雪
(() => { const box = document.getElementById('snow'); if (!box) return;
  for (let i = 0; i < 14; i++) { const f = document.createElement('span'); f.className = 'flake';
    f.style.left = (Math.random()*100).toFixed(1) + '%'; f.style.animationDuration = (6 + Math.random()*6).toFixed(1) + 's';
    f.style.animationDelay = (-Math.random()*10).toFixed(1) + 's'; const z = 3 + Math.random()*5; f.style.width = f.style.height = z.toFixed(1) + 'px';
    box.appendChild(f); } })();
</script>
