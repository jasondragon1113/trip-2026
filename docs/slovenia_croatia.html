<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>斯洛維尼亞＋克羅埃西亞小旅行</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: 手繪旅行手帳 — 貼紙式 hero → 卷軸簡圖 → 每日分頁時間軸 → 美食/挑戰/預算/準備清單；白底淡彩、手機一欄 */
:root{
  --p:#2E86DE; --s:#FFB84C; --soft:color-mix(in srgb,var(--p) 12%,#FFFFFF);
  --bg:#FFFDF7; --paper:#FFFFFF; --paper-2:#FFF7E8; --line:#E8DCC8; --line-ink:#3B3024;
  --ink:#3B3024; --ink-dim:#6F6151; --ink-faint:#8A7B6A;
  --ok:#3E9B5F; --warn:#C9811A; --danger:#D1495B;
  --font-hand:'LXGW WenKai TC','PingFang TC',serif;
  --font-body:'Huninn','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-num:'Nunito','Huninn',system-ui,sans-serif;
  --r:18px; --pill:999px;
  --blob:255px 18px 225px 18px / 18px 225px 18px 255px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 4px 0 var(--line);
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;
  background-image:radial-gradient(var(--line) .8px, transparent .8px);background-size:22px 22px}
.wrap > *{min-width:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:12px 60px;display:grid;gap:26px}
h1,h2,h3{margin:0;font-family:var(--font-hand);font-weight:700;text-wrap:balance;line-height:1.25}
h2{font-size:24px;display:flex;align-items:center;gap:10px}
h2 .ico{width:28px;height:28px;color:var(--p)}
h3{font-size:18px}
a{color:var(--p)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.dim{color:var(--ink-dim)} .faint{color:var(--ink-faint);font-size:12.5px}
.ico{display:inline-block;width:20px;height:20px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--s);outline-offset:2px;border-radius:6px}

/* paper card with hand-drawn edge */
.card{background:var(--paper);border:2px solid var(--line-ink);border-radius:var(--blob);box-shadow:var(--shadow);padding:18px 20px}
.tape{position:relative}
.tape::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:24px;transform:translateX(-50%) rotate(-3deg);
  background:color-mix(in srgb,var(--s) 55%,white);opacity:.9;border-radius:3px;mix-blend-mode:multiply}

/* top nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.nav .brand{font-family:var(--font-hand);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.nav .brand .ico{color:var(--p);width:24px;height:24px}
.nav .links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav .links a{text-decoration:none;color:var(--ink-dim);font-size:13.5px;padding:6px 10px;border-radius:var(--pill);white-space:nowrap}
.nav .links a:hover{background:var(--soft);color:var(--ink)}
.nav .back{font-size:13.5px;text-decoration:none;color:var(--ink-dim);white-space:nowrap}

/* cover poster */
.cover{margin:8px 0 0;padding:10px;overflow:hidden}
.cover img{display:block;width:100%;height:auto;border-radius:12px;max-width:100%}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center}
.hero .stamp{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--p);border:2px solid var(--p);border-radius:var(--pill);padding:4px 12px;font-size:13px;font-weight:700;transform:rotate(-2deg)}
.hero h1{font-size:clamp(34px,6vw,56px);margin-top:10px}
.hero h1 small{display:block;font-size:.5em;color:var(--p);font-weight:400}
.hero .tag{font-size:19px;color:var(--ink-dim);margin-top:6px}
.hero p{margin:12px 0 0;max-width:40ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:0}
.stat{background:var(--paper);border:2px solid var(--line-ink);border-radius:var(--blob);padding:12px 14px;text-align:center;box-shadow:var(--shadow);transform:rotate(var(--rot,0deg))}
.stat b{display:block;font-family:var(--font-num);font-size:26px;font-weight:900;color:var(--p);line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-dim)}
.stat:nth-child(1){--rot:-1.5deg} .stat:nth-child(2){--rot:1deg} .stat:nth-child(3){--rot:-.5deg}
.dates{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:14px}
.dates .d{background:var(--paper-2);border:2px dashed var(--line-ink);border-radius:var(--pill);padding:4px 12px;font-family:var(--font-num);font-weight:700}

/* sketch scroll */
.sketch{overflow-x:auto;padding:6px 0 10px;scrollbar-width:thin}
.sketch svg{display:block;min-width:720px;width:100%;height:auto}
.sketch .ttl{font-family:var(--font-hand);font-size:17px;font-weight:700;fill:var(--ink)}
.sketch .cap{font-family:var(--font-body);font-size:12.5px;fill:var(--ink-dim)}
.sketch .dayno{font-family:var(--font-num);font-size:12px;font-weight:900;fill:var(--p)}
.sketch .frame{fill:var(--paper);stroke:var(--line-ink);stroke-width:2}
.sketch .arrow{fill:none;stroke:var(--s);stroke-width:3;stroke-linecap:round;stroke-dasharray:6 7}
.sketch .pic{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sketch .pic.fill{fill:var(--soft)}
.sketch .ribbon{fill:var(--s)}
.sketch .ribbon-t{font-family:var(--font-hand);font-size:20px;font-weight:700;fill:#3B3024}

/* day tabs + timeline */
.daytabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.daytabs button{font:inherit;text-align:left;background:var(--paper);border:2px solid var(--line-ink);border-radius:14px;padding:8px 12px;cursor:pointer;color:var(--ink);transition:transform .3s var(--spring);box-shadow:var(--shadow)}
.daytabs button:hover{transform:translateY(-2px)}
.daytabs button[aria-selected="true"]{background:var(--p);color:#fff;border-color:var(--p)}
.daytabs .dn{display:block;font-family:var(--font-num);font-size:12px;font-weight:900;opacity:.85}
.daytabs .dt{display:block;font-family:var(--font-hand);font-size:16px;font-weight:700;line-height:1.2}
.day{display:grid;grid-template-columns:230px 1fr;gap:18px}
.day .side{background:var(--soft);border:2px solid var(--line-ink);border-radius:var(--blob);padding:18px;position:sticky;top:60px;align-self:start;display:grid;gap:8px}
.day .side h3{font-size:24px}
.day .side .k{display:flex;justify-content:space-between;border-bottom:2px dashed var(--line);padding:4px 0;font-size:13.5px}
.tl{display:grid;gap:14px;position:relative;padding-left:4px}
.stop{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.stop .t{font-family:var(--font-num);font-weight:900;font-size:15px;color:var(--p);padding-top:14px}
.stop .box{background:var(--paper);border:2px solid var(--line-ink);border-radius:var(--blob);padding:12px 14px;display:grid;gap:6px;box-shadow:var(--shadow);min-width:0}
.stop .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stop .head h3{flex:1 1 200px;display:flex;align-items:center;gap:8px}
.stop .head h3 .ico{color:var(--p)}
.stop .desc{color:var(--ink-dim);font-size:14px}
.stop .thumb{width:100%;max-height:190px;object-fit:cover;border-radius:10px;border:2px solid var(--line-ink);margin-bottom:2px}
.mini .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid var(--line-ink)}
.stop .tip{font-size:13px;background:var(--paper-2);border-radius:10px;padding:5px 10px;display:flex;gap:6px;align-items:flex-start}
.stop .tip .ico{width:16px;height:16px;color:var(--warn);margin-top:3px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;text-decoration:none;color:var(--ink);background:var(--paper-2);border:2px solid var(--line-ink);border-radius:var(--pill);padding:4px 11px;cursor:pointer;transition:transform .3s var(--spring)}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.95)}
.btn .ico{width:15px;height:15px}
.btn.map{background:var(--soft);color:var(--p);border-color:var(--p)}
.btn.lk{font-size:12px;padding:3px 9px;border-style:dashed}
.btn.lk-youtube{color:#C0392B}.btn.lk-ig{color:#B5347A}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:5px 9px;border-radius:var(--pill);white-space:nowrap;background:var(--paper-2);color:var(--ink-dim);border:1.5px solid var(--line)}
.b-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:transparent}
.b-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.b-danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);border-color:transparent}
.b-p{background:var(--soft);color:var(--p);border-color:transparent}
.kind-food{--p:var(--s)}

/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid > *{min-width:0}
.mini{background:var(--paper);border:2px solid var(--line-ink);border-radius:var(--blob);padding:14px 16px;display:grid;gap:6px;box-shadow:var(--shadow);align-content:start}
.mini h3{display:flex;align-items:center;gap:8px}
.mini .price{font-family:var(--font-num);font-weight:900;color:var(--p)}
.sec{display:grid;gap:14px}

/* budget */
.budget{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.budget table{width:100%;border-collapse:collapse;font-size:14.5px}
.budget td{padding:8px 4px;border-bottom:2px dashed var(--line)}
.budget td.r{text-align:right;font-family:var(--font-num);font-weight:700}
.budget tr.total td{border-bottom:0;font-size:18px;color:var(--p);font-weight:900}
.pie{display:grid;gap:6px}
.pie .row{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:13.5px}
.pie .bar{height:14px;border-radius:var(--pill);background:var(--soft);overflow:hidden;border:1.5px solid var(--line)}
.pie .bar i{display:block;height:100%;background:var(--p);border-radius:var(--pill)}
.pie .row:nth-child(2) .bar i{background:var(--s)} .pie .row:nth-child(3) .bar i{background:var(--ok)} .pie .row:nth-child(4) .bar i{background:var(--warn)} .pie .row:nth-child(5) .bar i{background:var(--danger)}

/* prep */
.prep{display:grid;gap:8px}
.prep label{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line-ink);border-radius:14px;padding:8px 12px;cursor:pointer;box-shadow:var(--shadow)}
.prep input{width:20px;height:20px;accent-color:var(--p)}
.prep label:has(input:checked){opacity:.6;text-decoration:line-through}
.prep .when{font-size:12.5px;color:var(--ink-faint);text-align:right}

.wx{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:end}
.wx b{display:block;font-family:var(--font-num);font-size:30px;font-weight:900;color:var(--p);line-height:1}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.two > *{min-width:0}
ul.plain{margin:0;padding-left:20px;display:grid;gap:4px}
details summary{cursor:pointer;color:var(--ink-dim)}
details ul{margin:8px 0 0;padding-left:20px;font-size:12.5px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:var(--pill);font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .day{grid-template-columns:1fr}
  .day .side{position:static}
  .budget{grid-template-columns:1fr}
  .stop{grid-template-columns:48px 1fr;gap:8px}
  .nav .back{display:none}
  .prep label{grid-template-columns:26px 1fr}
  .prep .when{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

  </section>

  <section class="sec" id="prep">

  </section>

  <details class="card" id="sources"></details>

</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const twd = n => (n == null || isNaN(n)) ? '待確認' : 'NT$' + Math.round(n).toLocaleString('en-US');
const wan = n => (n/10000).toFixed(1).replace(/\.0$/, '');
const rng = a => Array.isArray(a) ? `${twd(a[0])}–${Math.round(a[1]).toLocaleString('en-US')}` : twd(a);
const ico = n => `<svg class="ico" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;
const store = { get(k,d){ try{ return localStorage.getItem(k) ?? d }catch(e){ return d } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };
const KIND = {sight:'camera', food:'ramen', activity:'star', challenge:'hike', stay:'hotel', transport:'route', shop:'shopping', night:'night', sunrise:'sunrise', bar:'beer'};
const KIND_T = {sight:'景點', food:'吃', activity:'體驗', challenge:'挑戰', stay:'休息', transport:'移動', shop:'逛', night:'夜晚', sunrise:'日出', bar:'喝一杯'};
const LT = {youtube:'YouTube', ig:'IG', blog:'文章', official:'官網'};
const chips = ls => (ls||[]).filter(l => l.url).map(l => `<a class="btn lk lk-${esc(l.type||'blog')}" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.title||'')}">${ico('link')}${LT[l.type]||'介紹'}${l.title ? '：' + esc(l.title.length > 18 ? l.title.slice(0,18) + '…' : l.title) : ''}</a>`).join('');
const link = (u,t,cls='') => u ? `<a class="btn ${cls}" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : '';
const pal = D.palette || {};
if (pal.primary) document.documentElement.style.setProperty('--p', pal.primary);
if (pal.secondary) document.documentElement.style.setProperty('--s', pal.secondary);
if (D.motif) document.getElementById('brand-ico').innerHTML = `<use href="#i-${D.motif}"/>`;
document.getElementById('brand').textContent = D.name;
if (D.cover) { const c = document.getElementById('cover'); document.getElementById('coverimg').src = D.cover; document.getElementById('coverimg').alt = D.name + ' 行程手繪海報'; c.hidden = false; }

// hero
const b = D.budget || {};
document.getElementById('stamp').innerHTML = `${ico('flag')}${esc(D.country)}・${esc(D.subtitle||'')}`;
document.getElementById('h1').innerHTML = `${esc(D.name)}<small>${esc(D.tagline||'')}</small>`;
document.getElementById('tag').textContent = '';
document.getElementById('summary').textContent = D.summary || '';
document.getElementById('dates').innerHTML = `<span class="d">${esc(D.dates?.out)} → ${esc(D.dates?.back)}</span><span class="dim">${D.dates?.nights} 晚</span>${D.dates?.why ? `<span class="faint">${esc(D.dates.why)}</span>` : ''}`;
const isDirect = f => f.kind !== 'transfer' && ((/直飛/.test(f.airline||'') && !/轉機|無直飛/.test(f.airline||'')) || !/轉機|香港快運|國泰|無直飛|經.{1,6}(轉|HKG|KUL|SIN|HAN|ICN)/.test((f.airline||'') + (f.out||'') + (f.basis||'') + (f.note||'') + (f.back||'')));
const minF = (D.flights||[]).filter(f => f.price_pp_twd && isDirect(f)).sort((a,b) => a.price_pp_twd - b.price_pp_twd)[0];
document.getElementById('stats').innerHTML = `
  <div class="stat"><b>${(D.days||[]).length}</b><span>天</span></div>
  <div class="stat"><b>${b.total_for2 ? wan(b.total_for2[0]) + '–' + wan(b.total_for2[1]) : '–'}</b><span>萬・兩人全包</span></div>
  <div class="stat"><b>${minF ? Math.round(minF.price_pp_twd/1000) + 'K' : '–'}</b><span>直飛每人・${minF ? (minF.from === 'RMQ' ? '台中' : '桃園') + '出發' : ''}</span></div>`;

// sketch scroll: per-day photo polaroids (fallback to icons)
(function(){
  const days = D.sketch?.days || [];
  const n = days.length || 1, W = 1000, colW = (W - 40) / n, H = 310;
  const photosOf = i => { const d = (D.days||[])[i]; if (!d) return []; return d.stops.map(s => s.photo?.local || s.photo?.url).filter(Boolean).slice(0, n >= 5 ? 2 : 3); };
  let s = `<rect class="frame" x="8" y="40" width="${W-16}" height="${H-48}" rx="14" filter="url(#wobble)"/>`;
  s += `<path class="ribbon" d="M${W/2-170} 12 h340 l-10 18 l10 18 h-340 l10-18z" filter="url(#wobble)"/>`;
  s += `<text class="ribbon-t" x="${W/2}" y="38" text-anchor="middle">${esc(D.name)}${n}天${Math.max(n-1,0)}夜行程簡圖</text>`;
  days.forEach((d, i) => {
    const x = 20 + i * colW, cx = x + colW/2;
    s += `<text class="dayno" x="${x+10}" y="70">DAY ${i+1}</text>`;
    s += `<text class="ttl" x="${x+10}" y="92">${esc((d.title||'').replace(/^第.+?天[:：]\s*/, ''))}</text>`;
    const ph = photosOf(i);
    if (ph.length) {
      const k = ph.length, pw = Math.min(96, (colW - 24 - 8*(k-1)) / k), phh = pw * 0.78, sx = cx - (k*pw + 8*(k-1))/2;
      ph.forEach((u, j) => { const px = sx + j*(pw+8), rot = (j % 2 ? 2.5 : -2.5);
        s += `<g transform="rotate(${rot} ${px+pw/2} ${110+phh/2})"><rect class="pic fill" x="${px-3}" y="${107}" width="${pw+6}" height="${phh+14}" rx="3"/><image href="${esc(u)}" x="${px}" y="${110}" width="${pw}" height="${phh}" preserveAspectRatio="xMidYMid slice"/></g>`; });
    } else {
      const icons = (d.icons||[]).slice(0,4), k = icons.length, iw = Math.min(50, (colW - 24 - 8*(k-1)) / k), sx = cx - (k*iw + 8*(k-1))/2;
      icons.forEach((ic, j) => { const ix = sx + j*(iw+8);
        s += `<rect class="pic fill" x="${ix}" y="112" width="${iw}" height="${iw}" rx="12" filter="url(#wobble)"/><use href="#i-${ic}" x="${ix+iw*.17}" y="${112+iw*.17}" width="${iw*.66}" height="${iw*.66}" class="pic"/>`; });
    }
    s += `<text class="cap" x="${cx}" y="215" text-anchor="middle">${esc(d.caption||'')}</text>`;
    if (i < n-1) s += `<line x1="${x+colW}" y1="58" x2="${x+colW}" y2="${H-36}" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/><path class="arrow" d="M${x+colW-14} 100 l28 0" /><path class="arrow" style="stroke-dasharray:none" d="M${x+colW+8} 95 l6 5 l-6 5"/>`;
  });
  s += `<text class="cap" x="${W/2}" y="${H-18}" text-anchor="middle">${esc(D.dates?.out)} 出發 → ${esc(D.dates?.back)} 回家・${esc(D.getting_around?.mode||'')}</text>`;
  document.getElementById('sketch').innerHTML = s;
})();

// days
let cur = +store.get('rb-day-' + D.id, 0);
function renderTabs(){
  document.getElementById('daytabs').innerHTML = (D.days||[]).map((d,i) => `<button role="tab" aria-selected="${i===cur}" data-i="${i}"><span class="dn">DAY ${d.day}・${esc(d.date)}（${esc(d.weekday)}）</span><span class="dt">${esc(d.title)}</span></button>`).join('');
  document.querySelectorAll('#daytabs button').forEach(bt => bt.onclick = () => { cur = +bt.dataset.i; store.set('rb-day-' + D.id, cur); renderTabs(); renderDay(); });
}
function renderDay(){
  const d = (D.days||[])[cur]; if (!d) return;
  const cost = d.stops.reduce((a,s) => a + (s.price_for2_twd||0), 0);
  document.getElementById('day').innerHTML = `<div class="day">
    <aside class="side">
      <span class="faint num">DAY ${d.day} / ${esc(d.date)}（${esc(d.weekday)}）</span>
      <h3>${esc(d.title)}</h3>
      <div class="dim">${esc(d.summary||'')}</div>
      <div class="k"><span>區域</span><b>${esc(d.area||'')}</b></div>
      ${d.drive_km ? `<div class="k"><span>開車</span><b class="num">${esc(d.drive_km)} km・${esc(d.drive_time||'')}</b></div>` : ''}
      <div class="k"><span>這天花費</span><b class="num">${twd(cost)}</b></div>
      <div class="k"><span>幾個點</span><b class="num">${d.stops.length}</b></div>
    </aside>
    <div class="tl">${d.stops.map(s => `<div class="stop kind-${s.kind}">
      <div class="t">${esc(s.time)}</div>
      <div class="box">
        ${s.photo?.local || s.photo?.url ? `<img class="thumb" src="${esc(s.photo.local || s.photo.url)}" alt="" loading="lazy">` : ''}
        <div class="head"><h3>${ico(KIND[s.kind]||'pin')}${esc(s.name)}</h3>
          <span class="badge b-p">${KIND_T[s.kind]||esc(s.kind)}</span>
          ${s.stay_min ? `<span class="badge">停 ${s.stay_min >= 60 ? (s.stay_min/60).toFixed(1).replace(/\.0$/,'') + ' 小時' : s.stay_min + ' 分'}</span>` : ''}
          ${s.booking === '需預約' ? '<span class="badge b-danger">要預約</span>' : s.booking === '建議預約' ? '<span class="badge b-warn">建議預約</span>' : ''}
          ${s.price_for2_twd ? `<span class="badge num">兩人 ${twd(s.price_for2_twd)}</span>` : s.price_for2_twd === 0 ? '<span class="badge b-ok">免費</span>' : ''}
        </div>
        <div class="desc">${esc(s.desc||'')}</div>
        ${s.tip ? `<div class="tip">${ico('bulb')}<span>${esc(s.tip)}</span></div>` : ''}
        <div class="acts">${link(s.map_url, ico('map') + '開地圖', 'map')}${link(s.booking_url, ico('link') + '預約')}${s.site_url && s.site_url !== s.booking_url ? link(s.site_url, ico('link') + '官網') : ''}${s.address ? `<button class="btn" data-copy="${esc(s.address)}">${ico('copy')}複製地址</button>` : ''}${chips(s.links)}</div>
      </div></div>`).join('')}</div>
  </div>`;
  document.querySelectorAll('[data-copy]').forEach(bt => bt.onclick = () => copyText(bt.dataset.copy));
}
function copyText(t){
  const done = () => toast('已複製地址');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done).catch(() => fallback());
  else fallback();
  function fallback(){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('請長按複製：' + t); } ta.remove(); }
}
let tt; function toast(m){ const el = document.getElementById('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1800); }

// food / fun
document.getElementById('foodgrid').innerHTML = (D.food||[]).map(f => `<div class="mini">${f.photo?.local || f.photo?.url ? `<img class="thumb" src="${esc(f.photo.local || f.photo.url)}" alt="" loading="lazy">` : ''}<h3>${ico('ramen')}${esc(f.name)}</h3><div class="dim">${esc(f.dish)}</div><div><span class="price">${f.price_for2_twd != null ? '兩人 ' + twd(f.price_for2_twd) : '價格待確認'}</span> <span class="faint">${esc(f.area||'')}</span></div>${f.why ? `<div class="faint">${esc(f.why)}</div>` : ''}<div class="acts">${link(f.map_url, ico('map') + '開地圖', 'map')}${chips(f.links)}</div></div>`).join('') || '<span class="faint">待確認</span>';
document.getElementById('fungrid').innerHTML = (D.challenges||[]).map(f => `<div class="mini"><h3>${ico('hike')}${esc(f.name)}</h3><div class="dim">${esc(f.what)}</div><div><span class="price">${f.price_for2_twd ? '兩人 ' + twd(f.price_for2_twd) : f.price_for2_twd === 0 ? '免費' : '價格待確認'}</span> <span class="faint">${esc(f.duration||'')}</span></div><div class="acts">${f.booking ? `<span class="badge ${f.booking.includes('需') ? 'b-danger' : f.booking.includes('建議') ? 'b-warn' : 'b-ok'}">${esc(f.booking)}</span>` : ''}${f.season_ok === false ? '<span class="badge b-danger">這季節不行</span>' : ''}${link(f.map_url, ico('map') + '開地圖', 'map')}${link(f.url, ico('link') + '預約／官網')}${chips(f.links)}</div>${f.note ? `<div class="faint">${esc(f.note)}</div>` : ''}</div>`).join('') || '<span class="faint">待確認</span>';

// budget
(function(){
  const rows = [['機票（兩人）', [b.flights_for2, b.flights_for2]], ['住宿', [b.stay_for2, b.stay_for2]], ['吃', b.food_for2], ['交通', b.transport_for2], ['活動／門票', b.activities_for2]];
  document.getElementById('btable').innerHTML = rows.map(([k,v]) => `<tr><td>${k}</td><td class="r">${v && v[0] != null ? (v[0] === v[1] ? twd(v[0]) : rng(v)) : '待確認'}</td></tr>`).join('') + `<tr class="total"><td>合計</td><td class="r">${b.total_for2 ? rng(b.total_for2) : '待確認'}</td></tr>`;
  const mid = v => v ? ((v[0]||0) + (v[1]||v[0]||0)) / 2 : 0;
  const tot = rows.reduce((a,[,v]) => a + mid(v), 0) || 1;
  document.getElementById('pie').innerHTML = rows.map(([k,v]) => `<div class="row"><span>${k}</span><div class="bar"><i style="width:${(mid(v)/tot*100).toFixed(1)}%"></i></div><span class="num" style="text-align:right">${Math.round(mid(v)/tot*100)}%</span></div>`).join('');
  document.getElementById('bnote').textContent = b.note || '';
})();

// move + weather
(function(){
  const g = D.getting_around || {};
  const r = g.rental;
  document.getElementById('movecard').innerHTML = `<h2>${ico(g.mode === '自駕' ? 'car' : g.mode === '混合' ? 'car' : 'train')}怎麼移動：${esc(g.mode||'')}</h2>
    ${g.license ? `<p>${esc(g.license)}</p>` : ''}
    ${r ? `<div class="mini" style="box-shadow:none"><h3>${ico('car')}租車</h3><div>${esc(r.company)}・${esc(r.car)}・${r.days} 天</div><div><span class="price">${twd(r.price_total_twd)}</span> <span class="faint">${esc(r.insurance||'')}</span></div><div class="faint">${esc(r.pickup||'')} ${esc(r.note||'')}</div><div class="acts">${link(r.source, ico('link') + '看租車')}</div></div>` : ''}
    ${g.road_notes?.length ? `<ul class="plain">${g.road_notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${g.public?.length ? `<ul class="plain">${g.public.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}`;
  const w = D.weather || {};
  document.getElementById('wxcard').innerHTML = `<h2>${ico('cloud')}那幾天的天氣</h2>
    <div class="wx"><div><span class="faint">白天</span><b>${w.high_c ?? '–'}°</b></div><div><span class="faint">晚上</span><b>${w.low_c ?? '–'}°</b></div>${w.sunrise ? `<div><span class="faint">日出</span><b style="font-size:20px">${esc(w.sunrise)}</b></div>` : ''}${w.sunset ? `<div><span class="faint">日落</span><b style="font-size:20px">${esc(w.sunset)}</b></div>` : ''}</div>
    <p style="margin:10px 0 0">${esc(w.conditions||'')}</p>${w.wear ? `<div class="dim">穿：${esc(w.wear)}</div>` : ''}`;
})();

// stays
document.getElementById('staygrid').innerHTML = (D.stays||[]).map(h => `<div class="mini"><h3>${ico('hotel')}${esc(h.name)}</h3><div class="dim">${esc(h.area)}・${h.nights} 晚</div><div><span class="price">每晚 ${twd(h.price_night_for2_twd)}</span> <span class="badge ${(h.availability||'').includes('有') ? 'b-ok' : (h.availability||'').includes('滿') ? 'b-danger' : ''}">${esc(h.availability||'未知')}</span></div>${h.why ? `<div class="faint">${esc(h.why)}</div>` : ''}<div class="acts">${link(h.url, ico('link') + '看房價')}${link(h.map_url, ico('map') + '地圖', 'map')}</div></div>`).join('') || '<span class="faint">待確認</span>';

// prep checklist (per-viewer memory)
document.getElementById('preplist').innerHTML = (D.prep||[]).map((p,i) => `<label><input type="checkbox" id="prep-${D.id}-${i}" ${store.get('prep-' + D.id + '-' + i) === '1' ? 'checked' : ''}><span>${esc(p.item)}${p.url ? ` <a href="${esc(p.url)}" target="_blank" rel="noopener">↗</a>` : ''}</span><span class="when">${esc(p.when||'')}</span></label>`).join('');
document.querySelectorAll('#preplist input').forEach(cb => cb.onchange = () => store.set(cb.id.replace(/^prep-/, 'prep-'), cb.checked ? '1' : '0'));

// events / risks / sources
document.getElementById('events').innerHTML = `<h2>${ico('party')}那幾天有什麼</h2>` + ((D.events||[]).map(e => `<div style="display:grid;grid-template-columns:70px 1fr;gap:10px;padding:6px 0;border-bottom:2px dashed var(--line)"><span class="num dim">${esc(e.date)}</span><span><b>${esc(e.name)}</b>${e.note ? `<br><span class="dim">${esc(e.note)}</span>` : ''}${e.url ? ` <a href="${esc(e.url)}" target="_blank" rel="noopener">↗</a>` : ''}</span></div>`).join('') || '<span class="faint">待確認</span>');
document.getElementById('risks').innerHTML = `<h2>${ico('alert')}小提醒</h2><ul class="plain">${(D.risks||[]).map(r => `<li>${esc(r)}</li>`).join('')}</ul>`;
const srcs = [...(D.sources||[]), ...(D.youtube_refs||[]).map(y => y.url)].filter(Boolean);
const credits = [...(D.days||[]).flatMap(d => d.stops), ...(D.food||[])].map(x => x.photo).filter(p => p && p.credit).map(p => `${p.credit}（${p.license||''}）`);
const creditSet = [...new Set(credits)];
document.getElementById('sources').innerHTML = `<summary>來源與參考（${srcs.length}）・查價 ${esc(D.checked||'')}</summary>${(D.youtube_refs||[]).length ? `<ul>${D.youtube_refs.map(y => `<li><a href="${esc(y.url)}" target="_blank" rel="noopener">${esc(y.title)}</a> — ${esc(y.channel)}：${esc(y.takeaway)}</li>`).join('')}</ul>` : ''}${creditSet.length ? `<p class="faint">照片：Wikimedia Commons — ${esc(creditSet.join('、'))}</p>` : ''}<ul>${(D.sources||[]).map(u => /^https?:/.test(u) ? `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>` : `<li>${esc(u)}</li>`).join('')}</ul>`;

renderTabs(); renderDay();
</script>
</body></html>
